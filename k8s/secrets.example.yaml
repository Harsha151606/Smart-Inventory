# DO NOT COMMIT REAL SECRETS TO GIT.
# Create this secret imperatively with kubectl or via External Secrets Operator:
#   kubectl -n smart-inventory create secret generic inventory-secrets \
#     --from-literal=POSTGRES_USER=inventory_app \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=POSTGRES_DB=smart_inventory \
#     --from-literal=REDIS_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=PASSWORD_PEPPER="$(openssl rand -hex 32)" \
#     --from-literal=QR_SIGNING_KEY="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: inventory-secrets
  namespace: smart-inventory
type: Opaque
stringData:
  POSTGRES_USER: "inventory_app"
  POSTGRES_PASSWORD: "REPLACE_WITH_OPENSSL_RAND_HEX_24"
  POSTGRES_DB: "smart_inventory"
  REDIS_PASSWORD: "REPLACE_WITH_OPENSSL_RAND_HEX_24"
  JWT_SECRET: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  PASSWORD_PEPPER: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  QR_SIGNING_KEY: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
