apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: smart-inventory
spec:
  type: ClusterIP
  selector:
    app: smart-inventory-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-inventory-frontend
  namespace: smart-inventory
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: smart-inventory-frontend
  template:
    metadata:
      labels:
        app: smart-inventory-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: your-registry/smart-inventory-frontend:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp-dir
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smart-inventory-frontend-hpa
  namespace: smart-inventory
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smart-inventory-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: smart-inventory-frontend-pdb
  namespace: smart-inventory
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: smart-inventory-frontend
